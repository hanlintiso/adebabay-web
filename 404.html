<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Adebabay</title>
  <meta name="description" content="Download Adebabay to read this article and browse the marketplace for East African diaspora communities." />
  <meta name="robots" content="noindex" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green: #1A5C3A;
      --text: #111827;
      --text-muted: #6B7280;
      --white: #FFFFFF;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--green) 0%, #0F3D26 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      text-align: center;
      max-width: 420px;
    }

    .logo {
      color: var(--white);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 28px;
    }

    h1 {
      color: var(--white);
      font-size: clamp(24px, 6vw, 32px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
    }

    p {
      color: rgba(255,255,255,0.75);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .store-buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .store-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--white);
      color: var(--text);
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .store-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
    .store-btn-icon { font-size: 22px; }
    .store-btn-sub { font-size: 11px; font-weight: 400; color: var(--text-muted); display: block; text-align: left; }
    .store-btn-label { display: block; text-align: left; }

    .home-link {
      display: inline-block;
      margin-top: 28px;
      color: rgba(255,255,255,0.65);
      font-size: 13px;
      text-decoration: none;
    }
    .home-link:hover { color: var(--white); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Adebabay</div>
    <h1>Get the app to read this</h1>
    <p>This link opens directly in the Adebabay app. Download it free to read the full article and browse the marketplace for East African diaspora communities.</p>
    <div class="store-buttons">
      <a class="store-btn" href="https://apps.apple.com/app/id6781082852" target="_blank" rel="noopener">
        <span class="store-btn-icon">🍎</span>
        <span>
          <span class="store-btn-sub">Download on the</span>
          <span class="store-btn-label">App Store</span>
        </span>
      </a>
      <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.adebabay.app" target="_blank" rel="noopener">
        <span class="store-btn-icon">▶</span>
        <span>
          <span class="store-btn-sub">Get it on</span>
          <span class="store-btn-label">Google Play</span>
        </span>
      </a>
    </div>
    <a class="home-link" href="/">adebabay.app</a>
  </div>
</body>
</html>
